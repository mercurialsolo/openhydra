name: Feature request
description: Suggest an improvement to OpenHydra
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Propose a specific improvement with rationale and expected behavior.
        If your report is a sensitive vulnerability, use private security reporting instead.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions for similar requests.
          required: true
        - label: I described the user/developer problem clearly.
          required: true
        - label: I did not include secrets, credentials, or private tokens.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What user/developer problem does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the preferred approach.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: impact
    attributes:
      label: Impact and scope
      description: Any compatibility, config, or migration impact?
