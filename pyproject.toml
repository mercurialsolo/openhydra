[project]
name = "openhydra"
version = "0.1.0"
description = "Lightweight local-first multi-agent orchestration"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "aiosqlite>=0.19",
    "typer>=0.9",
    "rich>=13.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.39"]
openai = ["openai>=1.0"]
ollama = ["httpx>=0.25"]
embeddings = ["scikit-learn>=1.3"]
vec = ["sqlite-vec>=0.1"]
all = [
    "anthropic>=0.39",
    "openai>=1.0",
    "httpx>=0.25",
    "scikit-learn>=1.3",
    "sqlite-vec>=0.1",
]

[project.scripts]
openhydra = "openhydra.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openhydra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
