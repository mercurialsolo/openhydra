[project]
name = "openhydra"
version = "0.1.0"
description = "Lightweight local-first multi-agent orchestration"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "aiosqlite>=0.19",
    "typer>=0.9",
    "rich>=13.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.39"]
openai = ["openai>=1.0"]
ollama = ["httpx>=0.25"]
agent-sdk = ["claude-agent-sdk>=0.1.30"]
embeddings = ["scikit-learn>=1.3"]
vec = ["sqlite-vec>=0.1"]
web = ["starlette>=0.36", "uvicorn>=0.27", "httpx>=0.25"]
slack = ["slack-bolt>=1.18"]
discord = ["discord.py>=2.3"]
whatsapp = []  # Baileys runs as Node.js subprocess, no Python deps; cloud-api needs httpx
email = ["aioimaplib>=1.0", "aiosmtplib>=3.0"]
channels = [
    "starlette>=0.36",
    "uvicorn>=0.27",
    "httpx>=0.25",
    "slack-bolt>=1.18",
    "discord.py>=2.3",
]
all = [
    "claude-agent-sdk>=0.1.30",
    "anthropic>=0.39",
    "openai>=1.0",
    "httpx>=0.25",
    "scikit-learn>=1.3",
    "sqlite-vec>=0.1",
    "starlette>=0.36",
    "uvicorn>=0.27",
    "slack-bolt>=1.18",
    "discord.py>=2.3",
]

[project.scripts]
openhydra = "openhydra.cli.main:app"

[project.entry-points."openhydra.channels"]
web = "openhydra.channels.web:create_channel"
slack = "openhydra.channels.slack:create_channel"
discord = "openhydra.channels.discord:create_channel"
whatsapp = "openhydra.channels.whatsapp:create_channel"
email = "openhydra.channels.email:create_channel"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openhydra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
